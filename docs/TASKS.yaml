# WBS (Work Breakdown Structure)
# プロジェクト: [未定義]
# 作成日: 2026-01-28
# 最終更新: 2026-01-28

project:
  name: "[未定義]"
  status: "INITIAL_SETUP"
  start_date: null
  target_release: null

phases:
  - id: "phase_1"
    name: "企画"
    status: "not_started"
    gate: "Gate A (PRD)"
    tasks: []

  - id: "phase_2"
    name: "仕様策定"
    status: "not_started"
    gate: "Gate B (SRS)"
    dependencies: ["phase_1"]
    tasks: []

  - id: "phase_3"
    name: "実装"
    status: "not_started"
    gate: "Gate C (実装)"
    dependencies: ["phase_2"]
    tasks: []

  - id: "phase_4"
    name: "テスト"
    status: "not_started"
    dependencies: ["phase_3"]
    tasks: []

  - id: "phase_5"
    name: "リリース"
    status: "not_started"
    dependencies: ["phase_4"]
    tasks: []

